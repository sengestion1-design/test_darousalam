name: Deploy to IONOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via SFTP with lftp
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASS" sftp://$SFTP_HOST -e "
            set sftp:auto-confirm yes;
            set net:timeout 30;
            mirror -R --delete --exclude=.git --exclude=.github --exclude=.env --exclude=config/database.php --exclude=tmp/mpdf --exclude=node_modules --exclude=photos . /darousalam-business/;
            quit"
