name: Deploy via SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: kostya-ten/ssh-sftp-deploy@v4
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: 22
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          local_path: ./
          remote_path: /darousalam/
          exclude: |
            .git
            .github
            .env
            node_modules
            tmp
            composer.lock
            *.pdf
            photos
